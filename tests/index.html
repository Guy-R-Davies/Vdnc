<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Bayesian widget checks</title><script src="../math.js"></script></head>
<body><pre id="result">Running…</pre><iframe id="app" src="../index.html" style="width:1200px;height:1000px;border:0"></iframe>
<script>
"use strict";
let count=0;
const errors=[];
window.addEventListener("error",e=>errors.push(e.message));
const assert=(ok,message)=>{if(!ok)throw Error(message);count++;};
const close=(a,b,message)=>assert(Math.abs(a-b)<2e-9*Math.max(1,Math.abs(b)),`${message}: ${a} vs ${b}`);
const pause=()=>new Promise(r=>setTimeout(r,80));
const frame=document.getElementById("app");
const loaded=new Promise(r=>frame.addEventListener("load",r,{once:true}));
async function run(){
  const cases=await (await fetch("reference.json")).json();
  for(const c of cases){
    const m=Bayes.model(c.family,c.prior,c.data);
    close(m.logZ,c.logZ,c.family+" evidence against SciPy");
    close(m.priorLog(c.x),c.priorLog,c.family+" prior against SciPy");
    close(m.posteriorLog(c.x),c.posteriorLog,c.family+" posterior against SciPy");
    close(m.likelihoodLog(c.x),c.likelihoodLog,c.family+" likelihood against SciPy");
    close(m.posteriorLog(c.x),m.priorLog(c.x)+m.likelihoodLog(c.x)-m.logZ,c.family+" Bayes identity");
  }
  // Independent quadrature of the normalized curves and prior × likelihood.
  const integrate=(fn,a,b)=>{
    const n=20000,h=(b-a)/n;let sum=0;
    for(let i=0;i<n;i++)sum+=Math.exp(fn(a+(i+.5)*h));
    return sum*h;
  };
  for(const c of cases.filter((_,i)=>[0,4,5,9,12].includes(i))){
    const m=Bayes.model(c.family,c.prior,c.data),[a,b]=m.bounds;
    for(const [name,fn] of [["prior",m.priorLog],["posterior",m.posteriorLog],["likelihood",m.likelihoodDensityLog]]){
      assert(Math.abs(integrate(fn,a,b)-1)<.0001,c.family+" normalized "+name);
    }
    assert(Math.abs(integrate(x=>m.priorLog(x)+m.likelihoodLog(x),a,b)/Math.exp(m.logZ)-1)<.0001,c.family+" integrated evidence");
  }
  for(let n=1;n<=15;n++){
    for(let k=0;k<=n;k++)close(Math.exp(Bayes.model("beta",{a:1,b:1},{k,n}).logZ),1/(n+1),"Uniform-prior predictive count");
  }
  assert(Bayes.betaLog(0,.1,1)===Infinity,"Beta singular boundary");
  close(Bayes.betaLog(0,1,1),0,"Uniform beta endpoint");
  assert(Bayes.gammaLog(0,.1,1)===Infinity,"Gamma singular boundary");
  await loaded;await pause();
  const w=frame.contentWindow,d=w.document,$=id=>d.getElementById(id);
  w.addEventListener("error",e=>errors.push(e.message));
  const change=(id,value,type="change")=>{const e=$(id);e.value=value;e.dispatchEvent(new w.Event(type,{bubbles:true}));};
  const click=id=>$(id).click();
  const displayedMeans=()=>[...d.querySelectorAll(".distribution-stats strong")].map(e=>Number(e.textContent.replaceAll(",","")));
  const checkMeans=(prior,estimate,posterior)=>{
    const actual=displayedMeans();
    [prior,estimate,posterior].forEach((expected,i)=>assert(Math.abs(actual[i]-expected)<=.0005*Math.max(1,Math.abs(expected)),`Displayed statistic ${i}: ${actual[i]} vs ${expected}`));
  };
  const uniqueIDs=()=>{
    const ids=[...d.querySelectorAll("[id]")].map(e=>e.id);
    assert(new Set(ids).size===ids.length,"All controls and readouts have unique IDs");
  };
  const checkCurrentStats=family=>{
    const v=id=>$(id).valueAsNumber;
    let prior,estimate,posterior;
    if(family==="beta"){
      const a=v("prior-a"),b=v("prior-b"),k=v("data-k"),n=v("data-n");
      prior=a/(a+b);estimate=k/n;posterior=(a+k)/(a+b+n);
    }else if(family==="gamma"){
      const a=v("prior-a"),s=v("prior-scale"),k=v("data-k"),t=v("data-t");
      prior=a*s;estimate=k/t;posterior=(a+k)*s/(1+s*t);
    }else{
      const mean=v("prior-mean"),sd=v("prior-sd"),y=v("data-y"),se=v("data-se");
      prior=mean;estimate=y;posterior=(se**2*mean+sd**2*y)/(sd**2+se**2);
    }
    checkMeans(prior,estimate,posterior);
    for(const input of d.querySelectorAll('input[type="number"]')){
      assert(input.validity.valid,"Valid numeric control: "+input.id);
      assert(input.valueAsNumber===$(input.id+"-range").valueAsNumber,"Input and slider agree: "+input.id);
    }
  };
  const validPlot=()=>{
    assert($("plot").querySelectorAll("path").length>=5,"Plot rendered");
    for(const path of $("plot").querySelectorAll("path"))assert(!/NaN|Infinity|undefined/.test(path.getAttribute("d")),"Finite SVG path");
    assert(!d.documentElement.scrollWidth || d.documentElement.scrollWidth<=frame.clientWidth+1,"No horizontal page overflow");
  };
  // Reproduce the reported stale readout before exercising any other controls.
  change("model","normal");await pause();
  checkMeans(0,2,72/37);uniqueIDs();
  change("prior-mean",-2,"input");await pause();
  checkMeans(-2,2,70/37);
  change("prior-mean-range",1.5,"input");await pause();
  checkMeans(1.5,2,73.5/37);
  assert($("prior-mean").value==="1.5","Mean slider updates its numeric input");
  change("model","beta");await pause();
  assert($("evidence").textContent==="7.692%","Default count evidence");validPlot();
  click("pin");await pause();assert($("comparison").textContent.includes("1×"),"Pinned evidence initially equal");
  d.querySelector('[data-preset="aligned"]').click();await pause();
  assert(!$("comparison").textContent.includes("1×"),"Changed prior changes evidence ratio");
  const firstEvidence=$("evidence").textContent;
  change("likelihood-scale","actual");await pause();
  assert($("evidence").textContent===firstEvidence,"Display scaling leaves evidence unchanged");validPlot();
  change("data-n",3,"input");await pause();
  assert($("data-k").value==="3"&&$("data-k-range").max==="3","Heads clamp to reduced trial count");
  change("data-n",0,"change");assert($("data-n").value==="1","Invalid count clamps on commit");
  const beforeEmpty=$("evidence").textContent;
  change("data-n","","input");assert($("evidence").textContent===beforeEmpty,"Empty numeric input preserves state");
  change("data-n","","change");assert($("data-n").value==="1","Empty numeric input restores on commit");
  for(const family of ["beta","gamma","normal"]){
    change("model",family);await pause();
    uniqueIDs();checkCurrentStats(family);
    if(family==="gamma")assert(d.querySelector('[data-preset="broad"]').getAttribute("aria-pressed")==="false","Gamma default is not the broad preset");
    assert($("pinned-key").hidden,"Model switch clears incompatible pinned prior");
    for(const preset of ["broad","aligned","sceptical","confident"]){
      d.querySelector(`[data-preset="${preset}"]`).click();await pause();validPlot();
      uniqueIDs();checkCurrentStats(family);
      for(const input of d.querySelectorAll('input[type="number"]'))assert(input.validity.valid,"Preset inputs valid: "+input.id+"="+input.value);
    }
    if(family==="beta") {change("prior-a",.1,"input");change("data-k",0,"input");}
    if(family==="gamma") {change("prior-a",.1,"input");change("data-k",0,"input");}
    if(family==="normal") {change("prior-sd",.1,"input");change("prior-mean",-10,"input");change("data-y",5,"input");change("data-se",.05,"input");}
    await pause();validPlot();
    if(family==="normal")assert($("evidence").textContent.includes("10")&&!$("evidence").textContent.includes("0 ×"),"Extreme evidence avoids underflow");
    for(const mode of ["density","actual"]){
      change("likelihood-scale",mode);
      for(const scale of ["linear","log"]){click(scale);await pause();validPlot();}
    }
    click("pin");await pause();validPlot();
    click("unpin");assert($("pinned-key").hidden,"Clear pinned prior");
    click("reset");await pause();validPlot();
    checkCurrentStats(family);
    // Exercise every numeric control through both input methods and its bounds.
    const controls=[...d.querySelectorAll('input[type="number"]')].map(e=>e.id);
    for(const id of controls){
      const input=$(id),min=Number(input.min),max=Number(input.max),step=Number(input.step);
      const middle=Number((min+Math.round((max-min)/2/step)*step).toFixed(8));
      for(const [target,value] of [[id,min],[id+"-range",middle],[id,max]]){
        change(target,value,target===id?"change":"input");await pause();
        checkCurrentStats(family);validPlot();
      }
    }
    click("reset");await pause();
    // A pinned prior stays fixed while both evidences use the new data.
    click("pin");
    const pinnedInputs=family==="beta"?{a:1,b:1}:family==="gamma"?{a:2,scale:2}:{mean:0,sd:3};
    if(family==="normal")change("prior-mean",1,"change");else change("prior-a",3,"change");
    if(family==="normal")change("data-y",1.5,"change");else change("data-k",4,"change");
    await pause();
    const activeInputs=family==="beta"?{a:3,b:1}:family==="gamma"?{a:3,scale:2}:{mean:1,sd:3};
    const activeData=family==="beta"?{k:4,n:12}:family==="gamma"?{k:4,t:2}:{y:1.5,se:.5};
    const activeModel=Bayes.model(family,activeInputs,activeData),pinnedModel=Bayes.model(family,pinnedInputs,activeData);
    const ratio=Number($("comparison").querySelector(".comparison-ratio").textContent.replace("×",""));
    assert(Math.abs(ratio/Math.exp(activeModel.logZ-pinnedModel.logZ)-1)<.0005,"Pinned comparison follows current data");
    const shownLogZ=Number($("log-evidence").textContent.match(/ln Z = ([^ ·]+)/)[1]);
    assert(Math.abs(shownLogZ-activeModel.logZ)<.000051,"Evidence readout follows parameters");
    click("reset");await pause();
    frame.style.width="375px";await pause();validPlot();
    frame.style.width="1200px";await pause();
  }
  assert(!errors.length,"No JavaScript errors: "+errors.join("; "));
  document.body.dataset.result="passed";
  document.getElementById("result").textContent=`${count} checks passed (SciPy references, integration, UI, responsive layout).`;
}
run().catch(e=>{document.body.dataset.result="failed";document.getElementById("result").textContent=e.stack;});
</script></body></html>
